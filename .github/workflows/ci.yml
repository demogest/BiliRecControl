name: Cross-platform CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
            platform: windows
            archive: windows-x64
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis
            platform: windows
            archive: windows-arm64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            platform: linux
            archive: linux-x64
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            platform: linux
            archive: linux-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            bundles: app,dmg
            platform: macos
            archive: macos-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            bundles: app,dmg
            platform: macos
            archive: macos-arm64
          - name: macOS Universal
            os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            platform: macos
            archive: macos-universal

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            rpm \
            zip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop packages
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign

      - name: Create Windows portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $binary = "src-tauri/target/${{ matrix.target }}/release/bilirec-control.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Portable executable not found: $binary"
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive `
            -LiteralPath $binary, "PORTABLE.md" `
            -DestinationPath "dist/BiliRec-Control-$version-${{ matrix.archive }}-portable.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Create Linux portable ZIP
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mkdir -p dist
          zip -j "dist/BiliRec-Control-${version}-${{ matrix.archive }}-portable.zip" "$appimage" PORTABLE.md

      - name: Create macOS portable ZIP
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/BiliRec-Control-${version}-${{ matrix.archive }}-portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: BiliRec-Control-${{ matrix.archive }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
